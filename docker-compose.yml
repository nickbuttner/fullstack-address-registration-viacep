services:
  postgres:
    image: postgres:16-alpine
    container_name: project_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:?crie o arquivo .env a partir do .env.example}
      POSTGRES_USER: ${DB_USERNAME:?crie o arquivo .env a partir do .env.example}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?crie o arquivo .env a partir do .env.example}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: project_backend
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:?crie o arquivo .env a partir do .env.example}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: project_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
